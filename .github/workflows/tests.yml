name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install PlantUML with the project installer
        shell: bash
        run: |
          python3 -B install-explain.py
          mkdir -p "$RUNNER_TEMP/plantuml-bin"
          ln -s "$GITHUB_WORKSPACE/.venv/bin/plantuml" "$RUNNER_TEMP/plantuml-bin/plantuml"
          echo "$RUNNER_TEMP/plantuml-bin" >> "$GITHUB_PATH"
      - name: Real PlantUML syntax integration tests
        env:
          EXPLAIN_PLANTUML_INTEGRATION: "1"
          PYTHONPATH: tests
        run: python3 -B -m unittest -v test_plantuml.RealPlantUMLTests test_plantuml.RealPlantUMLPipelineTests
      - name: Real root and foreign-owner integration tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          root_tests=$(mktemp -d /tmp/explain-root-tests.XXXXXX)
          trap 'sudo rm -rf "$root_tests"' EXIT
          chmod 755 "$root_tests"
          git archive HEAD | tar -x -C "$root_tests"
          cd "$root_tests"
          sudo env "PATH=$PATH" "PYTHONPATH=$PWD/tests" \
            "$(command -v python3)" -B -m unittest -v \
            test_startup.StartupCLIIntegrationTests.test_cli_under_actual_root \
            test_startup.StartupCLIIntegrationTests.test_actual_root_rejects_foreign_owner_until_explicit_trust \
            test_git_compat.RootOwnershipCompatibility \
            test_submodules.RecursiveRootTests
      - name: Git, folder, JSONC, and CLI integration tests
        run: |
          command -v git
          git --version
          python3 -B -m unittest discover -s tests -v
